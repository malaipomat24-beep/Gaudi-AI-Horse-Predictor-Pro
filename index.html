<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaudi AI Horse Predictor Pro</title>
  <style>
    body{
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
      padding:30px;
    }
    h1{color:#00ff99;}
    button{
      padding:15px 30px;
      background:#00b894;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }
    button:hover{
      background:#019875;
    }
    #result{
      margin-top:25px;
      font-size:20px;
      color:#ffd700;
    }
  </style>
</head>
<body>

<h1>🏇 Gaudi AI Horse Predictor Pro</h1>

<p>Welcome to your AI Horse Racing Predictor.</p>

<button onclick="predict()">Generate Prediction</button>

<div id="result"></div>

<script>
function predict(){
    const picks=[
      "Win: Horse 1 | Exacta: 1-4 | Trifecta: 1-4-7",
      "Win: Horse 3 | Exacta: 3-6 | Trifecta: 3-6-2",
      "Win: Horse 5 | Exacta: 5-2 | Trifecta: 5-2-8",
      "Win: Horse 7 | Exacta: 7-1 | Trifecta: 7-1-4"
    ];

    document.getElementById("result").innerHTML =
      picks[Math.floor(Math.random()*picks.length)];
}
</script>

</body>
</html>
